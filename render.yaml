# Render blueprint for BizPilot.
#
# Deploy with: Render dashboard → New → Blueprint → point at this repo.
# Everything below is created in one go: Postgres, Redis, the API and the web app.
#
# After the first deploy you must set the secrets marked `sync: false` in the
# Render dashboard — they are deliberately not in this file.

# Every service must sit in the SAME region. Render's private network is
# per-region, so an API in Frankfurt cannot reach a database left on the default
# (Oregon) — the deploy builds fine and then fails at boot, unable to connect.
databases:
  - name: bizpilot-db
    databaseName: bizpilot
    user: bizpilot
    region: frankfurt
    plan: free # upgrade to `basic` before real customers: free expires after 30 days
    postgresMajorVersion: '16'

services:
  # ---------------------------------------------------------------------------
  # Redis — BullMQ queues (SMS), dashboard cache, receipt/invoice numbering
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: bizpilot-redis
    region: frankfurt
    plan: free
    ipAllowList: [] # reachable only from inside Render's private network
    maxmemoryPolicy: noeviction # BullMQ jobs must never be evicted

  # ---------------------------------------------------------------------------
  # API — NestJS
  # ---------------------------------------------------------------------------
  - type: web
    name: bizpilot-api
    runtime: node
    plan: free # a free instance sleeps after 15 min idle; see README before launch
    region: frankfurt # closest Render region to Rwanda
    branch: main
    healthCheckPath: /api/health
    buildCommand: >-
      npm ci &&
      npm run build --workspace=packages/shared &&
      npx prisma generate --schema=apps/api/prisma/schema.prisma &&
      npm run build --workspace=apps/api
    # Migrations run at start, not at build: the build step has no database
    # attached, and this way a rollback re-runs against the right schema.
    startCommand: >-
      npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma &&
      node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000 # Render's default internal port
      - key: DATABASE_URL
        fromDatabase:
          name: bizpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bizpilot-redis
          type: keyvalue
          property: connectionString
      # Generated once by Render and kept for the life of the service.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: API_URL
        fromService:
          name: bizpilot-api
          type: web
          property: host
      # Must match the web service's URL exactly, or the browser blocks every
      # request. Update it in the dashboard once the static site has its domain.
      - key: WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # --- Secrets: set these in the Render dashboard ---------------------
      # Comma-separated emails allowed to see BizPilot's own revenue dashboard.
      # Empty means nobody; set it to your own address after the first deploy.
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      - key: AI_COST_PER_MESSAGE_RWF
        value: '1500'
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: ANTHROPIC_EFFORT
        value: low
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_HASH
        sync: false
      - key: SMS_PROVIDER
        value: log # switch to africastalking once you have credentials
      - key: SMS_SENDER_ID
        value: BizPilot
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # Web — React static site
  # ---------------------------------------------------------------------------
  - type: web
    name: bizpilot-web
    runtime: static
    branch: main
    buildCommand: >-
      npm ci &&
      npm run build --workspace=packages/shared &&
      npm run build --workspace=apps/web
    staticPublishPath: apps/web/dist
    envVars:
      # Baked in at build time. Set it to https://<api-host>/api once the API
      # service exists, then trigger a rebuild of this site.
      - key: VITE_API_URL
        sync: false
    routes:
      # Single-page app: every unknown path must serve index.html or a refresh
      # on /app/sales returns a 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
