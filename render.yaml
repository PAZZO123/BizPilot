# Render blueprint for BizPilot.
#
# Deploy with: Render dashboard → New → Blueprint → point at this repo.
# It creates three things in one go: the key value store, the API and the web app.
# The database is separate — see below.
#
# After the first deploy you must set the values marked `sync: false` in the
# Render dashboard. They are deliberately not in this file.

# The database is NOT declared here — it lives on Neon.
#
# Render's own free Postgres is deleted after 30 days, taking every shop's
# records with it. Neon's free tier does not expire, which is the difference
# between a link you can leave up and one that dies next month. The cost is a
# hop over the public internet instead of Render's private network, and two
# connection strings instead of one (see DATABASE_URL / DIRECT_URL below).
#
# See docs/DEPLOY.md section 1 for creating the Neon project.
#
# Everything that IS here must sit in the SAME region. Render's private network
# is per-region, so an API in Frankfurt cannot reach a key value store left on
# the default (Oregon) — it builds fine and then fails at boot.
services:
  # ---------------------------------------------------------------------------
  # Redis — BullMQ queues (SMS), dashboard cache, receipt/invoice numbering
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: bizpilot-redis
    region: frankfurt
    plan: free
    ipAllowList: [] # reachable only from inside Render's private network
    maxmemoryPolicy: noeviction # BullMQ jobs must never be evicted

  # ---------------------------------------------------------------------------
  # API — NestJS
  # ---------------------------------------------------------------------------
  - type: web
    name: bizpilot-api
    runtime: node
    plan: free # a free instance sleeps after 15 min idle; see README before launch
    region: frankfurt # closest Render region to Rwanda
    branch: main
    healthCheckPath: /api/health
    buildCommand: >-
      npm ci &&
      npm run build --workspace=packages/shared &&
      npx prisma generate --schema=apps/api/prisma/schema.prisma &&
      npm run build --workspace=apps/api
    # Migrations run at start, not at build: the build step has no database
    # attached, and this way a rollback re-runs against the right schema.
    startCommand: >-
      npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma &&
      node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000 # Render's default internal port
      # Both come from the Neon dashboard. Pick "Prisma" in their connection
      # string widget and it prints the two you need.
      #   DATABASE_URL — the POOLED endpoint ("-pooler" in the host). All normal
      #                  queries. Neon's compute scales to zero and the pooler
      #                  handles waking it.
      #   DIRECT_URL   — the direct endpoint, no pooler. `prisma migrate deploy`
      #                  runs in the start command below and takes advisory
      #                  locks, which do not survive transaction-mode pooling.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: bizpilot-redis
          type: keyvalue
          property: connectionString
      # Generated once by Render and kept for the life of the service.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: API_URL
        fromService:
          name: bizpilot-api
          type: web
          property: host
      # Must match the web service's URL exactly, or the browser blocks every
      # request. Update it in the dashboard once the static site has its domain.
      - key: WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # --- Secrets: set these in the Render dashboard ---------------------
      # Comma-separated emails allowed to see BizPilot's own revenue dashboard.
      # Empty means nobody; set it to your own address after the first deploy.
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      - key: AI_COST_PER_MESSAGE_RWF
        value: '1500'
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: ANTHROPIC_EFFORT
        value: low
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_HASH
        sync: false
      - key: SMS_PROVIDER
        value: log # switch to africastalking once you have credentials
      - key: SMS_SENDER_ID
        value: BizPilot
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # Web — React static site
  # ---------------------------------------------------------------------------
  - type: web
    name: bizpilot-web
    runtime: static
    branch: main
    buildCommand: >-
      npm ci &&
      npm run build --workspace=packages/shared &&
      npm run build --workspace=apps/web
    staticPublishPath: apps/web/dist
    envVars:
      # Baked in at build time. Set it to https://<api-host>/api once the API
      # service exists, then trigger a rebuild of this site.
      - key: VITE_API_URL
        sync: false
    routes:
      # Single-page app: every unknown path must serve index.html or a refresh
      # on /app/sales returns a 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
