<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A hardware shop wall hung with tools and stacked paint tins">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0B3B37"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>

  <!-- pegboard -->
  <g opacity=".2" fill="#F0FDFA">
    <g id="row">
      <circle cx="60" cy="60" r="5"/><circle cx="140" cy="60" r="5"/><circle cx="220" cy="60" r="5"/>
      <circle cx="300" cy="60" r="5"/><circle cx="380" cy="60" r="5"/><circle cx="460" cy="60" r="5"/>
      <circle cx="540" cy="60" r="5"/><circle cx="620" cy="60" r="5"/><circle cx="700" cy="60" r="5"/>
      <circle cx="780" cy="60" r="5"/><circle cx="860" cy="60" r="5"/><circle cx="940" cy="60" r="5"/>
      <circle cx="1020" cy="60" r="5"/><circle cx="1100" cy="60" r="5"/><circle cx="1180" cy="60" r="5"/>
      <circle cx="1260" cy="60" r="5"/><circle cx="1340" cy="60" r="5"/><circle cx="1420" cy="60" r="5"/>
      <circle cx="1500" cy="60" r="5"/><circle cx="1580" cy="60" r="5"/>
    </g>
    <use href="#row" y="80"/><use href="#row" y="160"/><use href="#row" y="240"/>
    <use href="#row" y="320"/><use href="#row" y="400"/><use href="#row" y="480"/>
    <use href="#row" y="560"/><use href="#row" y="640"/><use href="#row" y="720"/>
  </g>

  <!-- hammer -->
  <g transform="translate(160,140)">
    <rect x="30" y="60" width="20" height="240" rx="8" fill="#A16207"/>
    <path d="M0 20 h110 v46 h-40 l-10 18 h-20 l-10-18 H0z" fill="#94A3B8"/>
    <rect x="0" y="20" width="18" height="46" fill="#64748B"/>
  </g>

  <!-- saw -->
  <g transform="translate(380,150)">
    <rect x="0" y="10" width="60" height="90" rx="14" fill="#C2410C"/>
    <rect x="46" y="34" width="230" height="42" fill="#94A3B8"/>
    <path d="M60 76 l16 22 l16-22 l16 22 l16-22 l16 22 l16-22 l16 22 l16-22 l16 22 l16-22 l16 22 l16-22 l16 22 l16-22z" fill="#94A3B8"/>
  </g>

  <!-- spanners -->
  <g transform="translate(760,130)" fill="#CBD5E1">
    <g>
      <rect x="12" y="50" width="18" height="200" rx="9"/>
      <path d="M0 40 a22 22 0 1 1 44 0 v14 h-14 v-10 h-16 v10 H0z"/>
      <path d="M0 262 a22 22 0 1 0 44 0 v-14 h-14 v10 h-16 v-10 H0z"/>
    </g>
    <g transform="translate(70,30)">
      <rect x="12" y="50" width="18" height="200" rx="9"/>
      <path d="M0 40 a22 22 0 1 1 44 0 v14 h-14 v-10 h-16 v10 H0z"/>
      <path d="M0 262 a22 22 0 1 0 44 0 v-14 h-14 v10 h-16 v-10 H0z"/>
    </g>
  </g>

  <!-- coils of rope / cable -->
  <g transform="translate(1080,150)" fill="none" stroke-width="14">
    <circle cx="110" cy="110" r="90" stroke="#A16207"/>
    <circle cx="110" cy="110" r="62" stroke="#A16207"/>
    <circle cx="110" cy="110" r="34" stroke="#A16207"/>
  </g>
  <g transform="translate(1340,170)" fill="none" stroke-width="12">
    <circle cx="90" cy="90" r="74" stroke="#0369A1"/>
    <circle cx="90" cy="90" r="48" stroke="#0369A1"/>
    <circle cx="90" cy="90" r="24" stroke="#0369A1"/>
  </g>

  <!-- shelf with paint tins -->
  <g transform="translate(0,560)">
    <g>
      <!-- bottom row -->
      <g>
        <rect x="120" y="120" width="130" height="130" rx="8" fill="#C2410C"/>
        <rect x="262" y="120" width="130" height="130" rx="8" fill="#EAB308"/>
        <rect x="404" y="120" width="130" height="130" rx="8" fill="#0369A1"/>
        <rect x="546" y="120" width="130" height="130" rx="8" fill="#4D7C0F"/>
        <rect x="688" y="120" width="130" height="130" rx="8" fill="#BE185D"/>
        <rect x="830" y="120" width="130" height="130" rx="8" fill="#7E22CE"/>
        <rect x="972" y="120" width="130" height="130" rx="8" fill="#C2410C"/>
        <rect x="1114" y="120" width="130" height="130" rx="8" fill="#0369A1"/>
        <rect x="1256" y="120" width="130" height="130" rx="8" fill="#EAB308"/>
      </g>
      <!-- top row, offset -->
      <g>
        <rect x="192" y="0" width="130" height="112" rx="8" fill="#4D7C0F"/>
        <rect x="334" y="0" width="130" height="112" rx="8" fill="#F8F4ED"/>
        <rect x="476" y="0" width="130" height="112" rx="8" fill="#C2410C"/>
        <rect x="618" y="0" width="130" height="112" rx="8" fill="#0369A1"/>
        <rect x="760" y="0" width="130" height="112" rx="8" fill="#EAB308"/>
        <rect x="902" y="0" width="130" height="112" rx="8" fill="#BE185D"/>
        <rect x="1044" y="0" width="130" height="112" rx="8" fill="#F8F4ED"/>
        <rect x="1186" y="0" width="130" height="112" rx="8" fill="#4D7C0F"/>
      </g>
      <!-- lid rims -->
      <g fill="#0B3B37" opacity=".25">
        <rect x="120" y="120" width="130" height="12" rx="6"/>
        <rect x="262" y="120" width="130" height="12" rx="6"/>
        <rect x="404" y="120" width="130" height="12" rx="6"/>
        <rect x="546" y="120" width="130" height="12" rx="6"/>
        <rect x="688" y="120" width="130" height="12" rx="6"/>
        <rect x="830" y="120" width="130" height="12" rx="6"/>
        <rect x="972" y="120" width="130" height="12" rx="6"/>
        <rect x="1114" y="120" width="130" height="12" rx="6"/>
        <rect x="1256" y="120" width="130" height="12" rx="6"/>
      </g>
    </g>
    <rect x="80" y="250" width="1440" height="26" rx="6" fill="#78350F"/>
  </g>

  <!-- timber leaning in the corner -->
  <g opacity=".7">
    <rect x="1470" y="330" width="26" height="520" rx="6" fill="#A16207" transform="rotate(6 1483 590)"/>
    <rect x="1512" y="310" width="26" height="540" rx="6" fill="#78350F" transform="rotate(3 1525 580)"/>
  </g>
</svg>
