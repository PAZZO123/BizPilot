<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Shelves of stock in a small shop">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A16207"/>
      <stop offset="1" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="#0B3B37" opacity=".35"/>

  <!-- back wall panelling -->
  <g opacity=".18" fill="#F0FDFA">
    <rect x="0" y="0" width="1600" height="900" fill="none"/>
    <rect x="120" y="0" width="3" height="900"/>
    <rect x="420" y="0" width="3" height="900"/>
    <rect x="760" y="0" width="3" height="900"/>
    <rect x="1100" y="0" width="3" height="900"/>
    <rect x="1420" y="0" width="3" height="900"/>
  </g>

  <!-- three shelves of stock -->
  <g>
    <!-- shelf 1 -->
    <g transform="translate(0,150)">
      <g fill="#F8F4ED">
        <rect x="140" y="34" width="72" height="116" rx="8" fill="#C2410C"/>
        <rect x="228" y="52" width="54" height="98" rx="8" fill="#EAB308"/>
        <rect x="298" y="20" width="88" height="130" rx="8" fill="#F8F4ED"/>
        <rect x="402" y="60" width="60" height="90" rx="8" fill="#0369A1"/>
        <rect x="478" y="40" width="76" height="110" rx="8" fill="#BE185D"/>
        <rect x="570" y="58" width="50" height="92" rx="8" fill="#4D7C0F"/>
        <rect x="636" y="26" width="84" height="124" rx="8" fill="#C2410C"/>
        <rect x="736" y="56" width="58" height="94" rx="8" fill="#F8F4ED"/>
        <rect x="810" y="38" width="70" height="112" rx="8" fill="#7E22CE"/>
        <rect x="896" y="62" width="52" height="88" rx="8" fill="#EAB308"/>
        <rect x="964" y="30" width="86" height="120" rx="8" fill="#0369A1"/>
        <rect x="1066" y="54" width="56" height="96" rx="8" fill="#C2410C"/>
        <rect x="1138" y="42" width="74" height="108" rx="8" fill="#F8F4ED"/>
        <rect x="1228" y="60" width="54" height="90" rx="8" fill="#4D7C0F"/>
        <rect x="1298" y="28" width="82" height="122" rx="8" fill="#BE185D"/>
        <rect x="1396" y="56" width="60" height="94" rx="8" fill="#EAB308"/>
      </g>
      <rect x="80" y="150" width="1440" height="22" rx="4" fill="url(#plank)"/>
    </g>

    <!-- shelf 2 — bottles -->
    <g transform="translate(0,400)">
      <g>
        <g fill="#F8F4ED" opacity=".95">
          <rect x="150" y="60" width="34" height="90" rx="6"/>
          <rect x="160" y="34" width="14" height="30" rx="4"/>
          <rect x="210" y="60" width="34" height="90" rx="6"/>
          <rect x="220" y="34" width="14" height="30" rx="4"/>
        </g>
        <g fill="#4D7C0F">
          <rect x="270" y="56" width="36" height="94" rx="6"/>
          <rect x="281" y="28" width="14" height="32" rx="4"/>
          <rect x="332" y="56" width="36" height="94" rx="6"/>
          <rect x="343" y="28" width="14" height="32" rx="4"/>
        </g>
        <g fill="#C2410C">
          <rect x="400" y="62" width="34" height="88" rx="6"/>
          <rect x="410" y="36" width="14" height="30" rx="4"/>
          <rect x="458" y="62" width="34" height="88" rx="6"/>
          <rect x="468" y="36" width="14" height="30" rx="4"/>
        </g>
        <!-- tins -->
        <g fill="#EAB308">
          <rect x="540" y="70" width="68" height="80" rx="6"/>
          <rect x="622" y="70" width="68" height="80" rx="6"/>
        </g>
        <g fill="#0369A1">
          <rect x="706" y="70" width="68" height="80" rx="6"/>
          <rect x="788" y="70" width="68" height="80" rx="6"/>
        </g>
        <g fill="#F8F4ED" opacity=".9">
          <rect x="872" y="70" width="68" height="80" rx="6"/>
          <rect x="954" y="70" width="68" height="80" rx="6"/>
        </g>
        <g fill="#BE185D">
          <rect x="1044" y="58" width="36" height="92" rx="6"/>
          <rect x="1055" y="30" width="14" height="32" rx="4"/>
          <rect x="1106" y="58" width="36" height="92" rx="6"/>
          <rect x="1117" y="30" width="14" height="32" rx="4"/>
        </g>
        <g fill="#7E22CE">
          <rect x="1180" y="70" width="68" height="80" rx="6"/>
          <rect x="1262" y="70" width="68" height="80" rx="6"/>
        </g>
        <g fill="#4D7C0F">
          <rect x="1350" y="58" width="36" height="92" rx="6"/>
          <rect x="1361" y="30" width="14" height="32" rx="4"/>
          <rect x="1412" y="58" width="36" height="92" rx="6"/>
          <rect x="1423" y="30" width="14" height="32" rx="4"/>
        </g>
      </g>
      <rect x="80" y="150" width="1440" height="22" rx="4" fill="url(#plank)"/>
    </g>

    <!-- shelf 3 — sacks and crates -->
    <g transform="translate(0,650)">
      <g>
        <path d="M150 150 q6-90 46-90 q40 0 46 90z" fill="#A16207"/>
        <path d="M262 150 q6-78 42-78 q36 0 42 78z" fill="#78350F"/>
        <path d="M370 150 q6-92 48-92 q42 0 48 92z" fill="#A16207"/>
        <rect x="500" y="66" width="140" height="84" rx="8" fill="#C2410C"/>
        <rect x="516" y="82" width="108" height="10" rx="5" fill="#F8F4ED" opacity=".55"/>
        <rect x="516" y="104" width="72" height="10" rx="5" fill="#F8F4ED" opacity=".35"/>
        <rect x="666" y="66" width="140" height="84" rx="8" fill="#0369A1"/>
        <rect x="682" y="82" width="108" height="10" rx="5" fill="#F8F4ED" opacity=".55"/>
        <rect x="682" y="104" width="72" height="10" rx="5" fill="#F8F4ED" opacity=".35"/>
        <path d="M846 150 q6-88 46-88 q40 0 46 88z" fill="#78350F"/>
        <path d="M962 150 q6-76 42-76 q36 0 42 76z" fill="#A16207"/>
        <rect x="1076" y="66" width="140" height="84" rx="8" fill="#4D7C0F"/>
        <rect x="1092" y="82" width="108" height="10" rx="5" fill="#F8F4ED" opacity=".55"/>
        <rect x="1092" y="104" width="72" height="10" rx="5" fill="#F8F4ED" opacity=".35"/>
        <path d="M1266 150 q6-90 46-90 q40 0 46 90z" fill="#A16207"/>
        <rect x="1382" y="66" width="120" height="84" rx="8" fill="#BE185D"/>
      </g>
      <rect x="80" y="150" width="1440" height="22" rx="4" fill="url(#plank)"/>
    </g>
  </g>

  <!-- warm light falling from the shop door, left -->
  <path d="M0 0 L520 0 L300 900 L0 900 Z" fill="#FDE68A" opacity=".10"/>
</svg>
